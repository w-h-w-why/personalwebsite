<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">翻单决策中心系统逻辑示意</title>
  <desc id="desc">商品、销量、库存和翻单系数进入规则引擎，经过销量预估、库存缺口和优先级计算，最终形成翻单池与可追溯的运行结果。</desc>
  <rect width="1600" height="1000" fill="#f3f2ec"/>
  <rect x="46" y="46" width="1508" height="908" rx="4" fill="#fbfaf6" stroke="#15150f" stroke-width="2"/>
  <path d="M46 126h1508" stroke="#d8d6ca"/>
  <text x="84" y="96" fill="#15150f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">FANDAN / 翻单决策中心</text>
  <circle cx="1472" cy="86" r="7" fill="#2f9e56"/>
  <text x="1400" y="92" fill="#65675b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">运行视图</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="84" y="176" fill="#2438e8" font-size="15" font-weight="700" letter-spacing="1">01 / 数据输入</text>
    <text x="84" y="212" fill="#15150f" font-size="22" font-weight="700">把分散信息收进同一条业务链路</text>

    <g>
      <rect x="84" y="246" width="292" height="154" rx="3" fill="#e9e8df" stroke="#b6b4a6"/>
      <text x="110" y="286" fill="#65675b" font-size="15">商品资料</text>
      <text x="110" y="326" fill="#15150f" font-size="23" font-weight="700">分类 · 标签 · 价格</text>
      <text x="110" y="364" fill="#65675b" font-size="15">商品主档与业务属性</text>
    </g>
    <g>
      <rect x="398" y="246" width="292" height="154" rx="3" fill="#e9e8df" stroke="#b6b4a6"/>
      <text x="424" y="286" fill="#65675b" font-size="15">经营表现</text>
      <text x="424" y="326" fill="#15150f" font-size="23" font-weight="700">销量 · 退货 · 趋势</text>
      <text x="424" y="364" fill="#65675b" font-size="15">渠道销售与历史表现</text>
    </g>
    <g>
      <rect x="712" y="246" width="292" height="154" rx="3" fill="#e9e8df" stroke="#b6b4a6"/>
      <text x="738" y="286" fill="#65675b" font-size="15">库存约束</text>
      <text x="738" y="326" fill="#15150f" font-size="23" font-weight="700">在库 · 在途 · 缺口</text>
      <text x="738" y="364" fill="#65675b" font-size="15">供给能力与补货空间</text>
    </g>
    <g>
      <rect x="1026" y="246" width="292" height="154" rx="3" fill="#15150f"/>
      <text x="1052" y="286" fill="#b9b9ac" font-size="15">业务规则</text>
      <text x="1052" y="326" fill="#d8f45a" font-size="23" font-weight="700">翻单 · 相似款 · 系数</text>
      <text x="1052" y="364" fill="#b9b9ac" font-size="15">可配置的判断基准</text>
    </g>
    <g>
      <rect x="1360" y="246" width="158" height="154" rx="3" fill="#2438e8"/>
      <text x="1384" y="286" fill="#c7cdff" font-size="15">人工输入</text>
      <text x="1384" y="326" fill="#fff" font-size="23" font-weight="700">Excel</text>
      <text x="1384" y="364" fill="#c7cdff" font-size="15">预检与确认</text>
    </g>

    <path d="M1360 324H1335v45H1318" fill="none" stroke="#2438e8" stroke-width="2"/>
    <path d="M1325 319l-10 5 10 5" fill="#2438e8"/>

    <text x="84" y="476" fill="#2438e8" font-size="15" font-weight="700" letter-spacing="1">02 / 规则计算</text>
    <text x="84" y="512" fill="#15150f" font-size="22" font-weight="700">先解释为什么，再给出建议数量</text>

    <g>
      <rect x="84" y="548" width="370" height="186" rx="3" fill="#fbfaf6" stroke="#15150f"/>
      <text x="112" y="586" fill="#2438e8" font-size="14" font-weight="700">STEP 01</text>
      <text x="112" y="628" fill="#15150f" font-size="25" font-weight="700">销量汇总与预估</text>
      <text x="112" y="669" fill="#65675b" font-size="15">按商品、渠道和时间窗口聚合</text>
      <text x="112" y="697" fill="#65675b" font-size="15">结合历史参考款估计未来需求</text>
    </g>
    <path d="M470 641h52" stroke="#2438e8" stroke-width="2"/>
    <path d="M514 634l10 7-10 7" fill="none" stroke="#2438e8" stroke-width="2"/>
    <g>
      <rect x="538" y="548" width="370" height="186" rx="3" fill="#fbfaf6" stroke="#15150f"/>
      <text x="566" y="586" fill="#2438e8" font-size="14" font-weight="700">STEP 02</text>
      <text x="566" y="628" fill="#15150f" font-size="25" font-weight="700">系数匹配与校验</text>
      <text x="566" y="669" fill="#65675b" font-size="15">匹配品类与商品规则系数</text>
      <text x="566" y="697" fill="#65675b" font-size="15">对 Excel 导入内容执行预检审计</text>
    </g>
    <path d="M924 641h52" stroke="#2438e8" stroke-width="2"/>
    <path d="M968 634l10 7-10 7" fill="none" stroke="#2438e8" stroke-width="2"/>
    <g>
      <rect x="992" y="548" width="370" height="186" rx="3" fill="#fbfaf6" stroke="#15150f"/>
      <text x="1020" y="586" fill="#2438e8" font-size="14" font-weight="700">STEP 03</text>
      <text x="1020" y="628" fill="#15150f" font-size="25" font-weight="700">缺口与优先级</text>
      <text x="1020" y="669" fill="#65675b" font-size="15">计算预测需求与库存缺口</text>
      <text x="1020" y="697" fill="#65675b" font-size="15">生成需翻单与持续关注池</text>
    </g>
    <g>
      <rect x="1382" y="548" width="136" height="186" rx="3" fill="#d8f45a"/>
      <text x="1410" y="586" fill="#15150f" font-size="14" font-weight="700">OUTPUT</text>
      <text x="1410" y="628" fill="#15150f" font-size="25" font-weight="700">可解释</text>
      <text x="1410" y="669" fill="#3e4036" font-size="15">结果快照</text>
      <text x="1410" y="697" fill="#3e4036" font-size="15">人工复核</text>
    </g>

    <text x="84" y="806" fill="#2438e8" font-size="15" font-weight="700" letter-spacing="1">03 / 产品闭环</text>
    <text x="84" y="842" fill="#15150f" font-size="22" font-weight="700">把一次判断沉淀为团队每天可以复用的流程</text>

    <g font-size="16" fill="#15150f">
      <text x="84" y="891">业务反馈</text>
      <text x="306" y="891">规则迭代</text>
      <text x="528" y="891">运行监控</text>
      <text x="750" y="891">权限与审计</text>
      <text x="972" y="891">商品团队日常使用</text>
    </g>
    <path d="M84 913h1366" stroke="#d8d6ca"/>
    <path d="M84 913h1184" stroke="#2438e8" stroke-width="4"/>
    <circle cx="84" cy="913" r="7" fill="#2438e8"/>
    <circle cx="296" cy="913" r="7" fill="#2438e8"/>
    <circle cx="518" cy="913" r="7" fill="#2438e8"/>
    <circle cx="740" cy="913" r="7" fill="#2438e8"/>
    <circle cx="1268" cy="913" r="8" fill="#d8f45a" stroke="#15150f" stroke-width="2"/>
  </g>
</svg>
