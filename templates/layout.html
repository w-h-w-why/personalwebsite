<!doctype html>
<!-- 由 build.mjs 生成；共享结构在 templates/layout.html，正文在 templates/pages/。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="{{NAME}} · 作品集">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{IMAGE}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1534">
  <meta property="og:image:height" content="355">
  <meta property="og:image:alt" content="AI 内容自动化 Workflow 案例截图">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{IMAGE}}">
  <link rel="canonical" href="{{URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="pages.css">
  <script src="site.js" defer></script>
</head>
<body>
  <div class="page{{PAGE_CLASS}}">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">W</span><span class="brand-name">{{NAME}}<em>·</em>作品集</span></a>
        <nav class="main-nav" aria-label="作品集目录">
{{NAV}}
        </nav>
        <div class="header-actions">
          <button class="copy-mail" type="button" data-copy-email="{{EMAIL}}" aria-describedby="copy-status" hidden>复制邮箱</button>
          <noscript><a class="copy-mail" href="mailto:{{EMAIL}}">邮件联系</a></noscript>
          <a class="dark" href="contact.html">联系我　↗</a>
        </div>
      </div>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite" hidden></p>
    </header>
    <main class="page-wrap">
{{CONTENT}}
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <span>© <span data-current-year>{{YEAR}}</span> {{NAME}} · {{ROLE}}</span>
        <span><a href="tel:{{PHONE}}">{{PHONE}}</a> · <a href="mailto:{{EMAIL}}">{{EMAIL}}</a></span>
      </div>
    </footer>
  </div>
</body>
</html>
