<!doctype html>
<!-- 由 build.mjs 生成；共享结构在 templates/layout.html，正文在 templates/pages/。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ec">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="{{NAME}} · 作品集">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{IMAGE}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1534">
  <meta property="og:image:height" content="355">
  <meta property="og:image:alt" content="AI 内容自动化 Workflow 案例截图">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{IMAGE}}">
  <link rel="canonical" href="{{URL}}">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>{{TITLE}}</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="{{CSS_HREF}}">
  <script src="{{JS_SRC}}" defer></script>
</head>
<body>
  <div class="page{{PAGE_CLASS}}" id="top">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="{{NAME}} 作品集首页">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span class="brand-text">{{NAME}}<small>AI 应用产品作品集</small></span>
        </a>
        <nav class="main-nav" id="site-nav" aria-label="作品集目录">
{{NAV}}
        </nav>
        <div class="header-actions">
          <button class="copy-mail" type="button" data-copy-email="{{EMAIL}}" aria-describedby="copy-status" hidden>复制邮箱</button>
          <noscript><a class="copy-mail" href="mailto:{{EMAIL}}">邮件联系</a></noscript>
          <a class="btn btn-dark header-cta" href="contact.html">联系我<span aria-hidden="true">↗</span></a>
          <button class="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="site-nav">
            <span class="nav-toggle-text">菜单</span>
            <span class="nav-toggle-bars" aria-hidden="true"><i></i><i></i></span>
          </button>
        </div>
      </div>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite" hidden></p>
    </header>
    <main class="site-main">
{{CONTENT}}
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <a class="brand" href="index.html" aria-label="{{NAME}} 作品集首页">
            <span class="brand-mark" aria-hidden="true">W</span>
            <span class="brand-text">{{NAME}}<small>AI 应用产品作品集</small></span>
          </a>
          <p>把前沿模型，变成真正可用的日常。</p>
        </div>
        <nav class="footer-nav" aria-label="页脚导航">
          <span class="footer-label">页面</span>
{{FOOTER_NAV}}
        </nav>
        <div class="footer-contact">
          <span class="footer-label">联系</span>
          <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
          <a href="tel:{{PHONE}}">{{PHONE}}</a>
          <span>杭州 · 可远程</span>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span data-current-year>{{YEAR}}</span> {{NAME}} · {{ROLE}}</span>
        <a href="#top">回到顶部 ↑</a>
      </div>
    </footer>
  </div>
</body>
</html>
